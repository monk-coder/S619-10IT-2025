{% extends "weather/base.html" %}

{% block title %}Редактировать заметку - Погода сейчас{% endblock %}

{% block content %}
<div class="auth-card edit-note-form">
    <h2>✏️ Редактировать заметку</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Заголовок:</label>
            <input type="text" name="title" value="{{ note.title }}"
                   class="search-input" required>
        </div>

        <div class="form-group">
            <label>Содержание:</label>
            <textarea name="content" class="note-textarea"
                     required>{{ note.content }}</textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">💾 Сохранить</button>
            <a href="{% url 'profile' %}" class="btn" style="background: #6c757d;">❌ Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
