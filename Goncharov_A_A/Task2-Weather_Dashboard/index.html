<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Жмурино</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="hud">
      <div class="hud__indicator">Этаж: <span id="floor-counter">1</span></div>
      <div class="hud__layer" id="layer-label">Слой: ядро Земли</div>
      <div class="hud__location" id="location-label">Погода: Экватор</div>
      <div class="hud__weather" id="weather-panel">
        <span id="weather-temp">--°C</span>
        <span id="weather-desc">нет данных</span>
        <img id="weather-icon" alt="иконка погоды" hidden />
      </div>
    </header>
    <main id="tower" class="tower" role="presentation"></main>
    <div id="event-overlay" class="overlay" aria-hidden="true"></div>
  </body>
</html>
