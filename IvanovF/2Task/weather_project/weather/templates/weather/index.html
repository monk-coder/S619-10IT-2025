{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Terminal Dashboard — Weather & Flights</title>

<!-- JetBrains Mono -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static 'weather/css/terminal-dashboard.css' %}">

  <script src="{% static 'weather/js/terminal-commands.js' %}" defer></script>
