{% extends 'dashboard/base.html' %}
{% block title %}Регистрация успешна{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 text-center">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fas fa-check text-green-600 text-3xl"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Регистрация успешна!</h2>
    <p class="text-gray-600 mb-6">Добро пожаловать в ваш персональный погодный дашборд.</p>
    <div class="animate-pulse">
        <i class="fas fa-cloud-sun text-yellow-500 text-4xl mb-4"></i>
    </div>
    <p class="text-sm text-gray-500 mt-4">Вы будете автоматически перенаправлены на дашборд через 3 секунды...</p>
    
    <script>
        setTimeout(function() {
            window.location.href = "{% url 'index' %}";
        }, 3000);
    </script>
</div>
{% endblock %}
