{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - Дашборд погоды{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-{% if task %}edit{% else %}plus{% endif %}"></i> {{ title }}</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% crispy form %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
