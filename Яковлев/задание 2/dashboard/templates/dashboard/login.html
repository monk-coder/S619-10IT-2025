{% extends 'dashboard/base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-sign-in-alt text-blue-600 text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Вход в систему</h2>
        <p class="text-gray-600 mt-2">Введите свои учетные данные</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="mb-6">
            <label class="block text-gray-700 font-medium mb-2">Логин</label>
            <input type="text" name="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
        </div>
        <div class="mb-8">
            <label class="block text-gray-700 font-medium mb-2">Пароль</label>
            <input type="password" name="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-200 font-medium">
            Войти
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <p class="text-gray-600">Нет аккаунта? 
            <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800 font-medium">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
