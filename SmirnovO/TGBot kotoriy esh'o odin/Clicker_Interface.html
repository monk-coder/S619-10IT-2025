        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6F6FF4;
            --primary-dark: #5555D1;
            --secondary: #FF6B6B;
            --accent: #FFD93D;
            --success: #6BCB77;
            --bg: #0F1419;
            --surface: #1A1F2E;
            --text: #E0E0E0;
            --text-muted: #A0A0A0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a2f4f 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .stat {
            background: var(--surface);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(111, 111, 244, 0.2);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 4px;
        }

        /* Game Screen */
        .game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .click-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: 3px solid var(--accent);
            cursor: pointer;
            font-size: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            box-shadow: 0 0 30px rgba(111, 111, 244, 0.6);
            position: relative;
            overflow: hidden;
        }

        .click-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(111, 111, 244, 0.8);
        }

        .click-button:active {
            transform: scale(0.95);
        }

        .click-button.no-energy {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .click-button::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            animation: pulse 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .floating-text {
            position: fixed;
            pointer-events: none;
            font-weight: bold;
            font-size: 24px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
            animation: float-up 1s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-80px) scale(0.8);
                opacity: 0;
            }
        }

        .energy-bar {
            width: 100%;
            height: 12px;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        .energy-text {
            text-align: center;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Bottom Navigation */
        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(111, 111, 244, 0.2);
        }

        .nav-btn {
            padding: 12px;
            background: var(--surface);
            border: 1px solid rgba(111, 111, 244, 0.3);
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 600;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(111, 111, 244, 0.4);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 15px;
            padding: 20px;
            max-width: 450px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(111, 111, 244, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--surface);
            border: none;
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        /* Shop */
        .shop-item {
            background: var(--bg);
            border: 1px solid rgba(111, 111, 244, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-info h3 {
            color: var(--primary);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .shop-info p {
            color: var(--text-muted);
            font-size: 12px;
        }

        .shop-price {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            margin-left: 10px;
        }

        .shop-price:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(111, 111, 244, 0.5);
        }

        .shop-price:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Leaderboard */
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(111, 111, 244, 0.1);
        }

        .leaderboard-rank {
            font-size: 20px;
            font-weight: bold;
            width: 40px;
            text-align: center;
        }

        .leaderboard-rank.first { color: #FFD700; }
        .leaderboard-rank.second { color: #C0C0C0; }
        .leaderboard-rank.third { color: #CD7F32; }

        .leaderboard-info {
            flex: 1;
            margin-left: 12px;
        }

        .leaderboard-name {
            color: var(--text);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .leaderboard-stats {
            font-size: 12px;
            color: var(--text-muted);
        }

        .leaderboard-clicks {
            text-align: right;
            color: var(--accent);
            font-weight: bold;
        }

        /* Achievements */
        .achievement-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(111, 111, 244, 0.1);
        }

        .achievement-icon {
            font-size: 30px;
            width: 50px;
            text-align: center;
        }

        .achievement-text {
            flex: 1;
            margin-left: 12px;
        }

        .achievement-name {
            color: var(--text);
            font-weight: 600;
        }

        .achievement-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .achievement-unlocked {
            color: var(--success);
            font-size: 12px;
            font-weight: 600;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: loading 1.4s infinite;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .click-button {
                width: 160px;
                height: 160px;
                font-size: 60px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Clicker Game</h1>
            <div class="user-info">
                <div class="stat">
                    <div class="stat-label">Уровень</div>
                    <div class="stat-value" id="level">1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Монеты</div>
                    <div class="stat-value" id="coins">0</div>
                </div>
            </div>
        </div>

        <div class="game-screen">
            <div style="text-align: center;">
                <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px;">Кликов: <span id="clicks" style="color: var(--accent); font-weight: bold;">0</span></div>
                <button id="clickBtn" class="click-button">💎</button>
            </div>

            <div style="width: 100%;">
                <div class="energy-bar">
                    <div class="energy-fill" id="energyFill" style="width: 100%;"></div>
                </div>
                <div class="energy-text">
                    Энергия: <span id="energyValue">100</span> / <span id="maxEnergy">100</span>
                </div>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="nav-btn active" data-screen="game">🎮 Игра</button>
            <button class="nav-btn" data-screen="shop">🛍️ Магазин</button>
            <button class="nav-btn" data-screen="leaderboard">🏆 Лидеры</button>
            <button class="nav-btn" data-screen="achievements">🎖️ Награды</button>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shopModal" class="modal">
        <div class="modal-content" style="position: relative;">
            <button class="close-btn" onclick="closeModal('shopModal')">×</button>
            <div class="modal-header">🛍️ Магазин улучшений</div>
            <div id="shopList"></div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content" style="position: relative;">
            <button class="close-btn" onclick="closeModal('leaderboardModal')">×</button>
            <div class="modal-header">🏆 Таблица лидеров</div>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <!-- Achievements Modal -->
    <div id="achievementsModal" class="modal">
        <div class="modal-content" style="position: relative;">
            <button class="close-btn" onclick="closeModal('achievementsModal')">×</button>
            <div class="modal-header">🎖️ Мои достижения</div>
            <div id="achievementsList"></div>
        </div>
    </div>

    <script>
        // ======================== GAME STATE ========================
        const ACHIEVEMENTS_DATA = {
            newbie: { name: "Новичок", desc: "Получить 100 кликов", icon: "🌟" },
            hardworker: { name: "Трудяга", desc: "Получить 1000 кликов", icon: "💪" },
            daily_clicker: { name: "Кликер дня", desc: "500 кликов в сутки", icon: "⭐" },
            marathoner: { name: "Марафонец", desc: "7 дней подряд входа", icon: "🏃" }
        };

        const UPGRADES = {
            double_click: {
                name: "Двойной клик",
                desc: "+2 за тап вместо +1",
                price: 100,
                icon: "2️⃣"
            },
            auto_clicker: {
                name: "Автокликер",
                desc: "+1 в секунду",
                price: 500,
                icon: "🤖"
            },
            more_energy: {
                name: "Больше энергии",
                desc: "Макс. энергия +100",
                price: 300,
                icon: "⚡"
            },
            fast_recovery: {
                name: "Быстрое восстановление",
                desc: "2 энергии/мин вместо 1",
                price: 400,
                icon: "⏩"
            }
        };

        let gameState = {
            userId: null,
            clicks: 0,
            coins: 0,
            level: 1,
            energy: 100,
            maxEnergy: 100,
            upgrades: {},
            achievements: [],
            lastEnergyRecoveryTime: Date.now()
        };

        let gameRunning = false;

        // ======================== INITIALIZATION ========================
        async function initGame() {
            // Получить user_id из Telegram Web App
            if (window.Telegram?.WebApp) {
                const webApp = window.Telegram.WebApp;
                const user = webApp.initDataUnsafe?.user;
                
                if (user) {
                    gameState.userId = user.id;
                    await loadUserData();
                    gameRunning = true;
                    startEnergyRecovery();
                    setupEventListeners();
                    renderShop();
                    
                    // Периодическое обновление данных с сервера
                    setInterval(loadUserData, 30000); // каждые 30 сек
                } else {
                    // Для тестирования
                    gameState.userId = 123456789;
                    gameRunning = true;
                    startEnergyRecovery();
                    setupEventListeners();
                    renderShop();
                }
            }
        }

        // ======================== API CALLS ========================
        async function apiCall(endpoint, method = 'GET', data = null) {
            try {
                const options = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(`http://localhost:8080${endpoint}`, options);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        async function loadUserData() {
            const data = await apiCall(`/api/user/${gameState.userId}`);
            
            if (data) {
                gameState.clicks = data.total_clicks;
                gameState.coins = data.total_coins;
                gameState.level = data.level;
                gameState.energy = data.energy;
                gameState.maxEnergy = data.max_energy;
                gameState.upgrades = data.upgrades;
                gameState.achievements = data.achievements;
                
                updateUI();
            }
        }

        async function processClick() {
            if (!gameRunning || gameState.energy < 1) return;

            const response = await apiCall('/api/click', 'POST', {
                user_id: gameState.userId
            });

            if (response && response.success) {
                gameState.clicks = response.clicks;
                gameState.level = response.level;
                gameState.energy = response.energy;
                
                // Визуальный эффект
                const btn = document.getElementById('clickBtn');
                btn.style.animation = 'none';
                setTimeout(() => {
                    btn.style.animation = '';
                }, 10);

                // Всплывающий текст
                createFloatingText(`+${response.points_earned}`);
                
                updateUI();
            }
        }

        async function buyUpgrade(upgradeKey) {
            const response = await apiCall('/api/upgrade', 'POST', {
                user_id: gameState.userId,
                upgrade: upgradeKey
            });

            if (response && response.success) {
                gameState.coins = response.coins_left;
                await loadUserData();
                alert('✅ Улучшение приобретено!');
            } else {
                alert('❌ Недостаточно монет');
            }
        }

        async function recoverEnergy() {
            const response = await apiCall('/api/recover-energy', 'POST', {
                user_id: gameState.userId
            });

            if (response) {
                gameState.energy = response.energy;
                updateUI();
            }
        }

        // ======================== ENERGY RECOVERY ========================
        function startEnergyRecovery() {
            setInterval(() => {
                if (gameState.energy < gameState.maxEnergy) {
                    const recoveryRate = gameState.upgrades.fast_recovery > 0 ? 2 : 1;
                    gameState.energy = Math.min(
                        gameState.energy + recoveryRate,
                        gameState.maxEnergy
                    );
                    updateUI();
                }
            }, 60000); // каждую минуту
        }

        // ======================== UI UPDATES ========================
        function updateUI() {
            document.getElementById('clicks').textContent = gameState.clicks.toLocaleString();
            document.getElementById('coins').textContent = gameState.coins.toLocaleString();
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('energyValue').textContent = gameState.energy;
            document.getElementById('maxEnergy').textContent = gameState.maxEnergy;

            const energyPercent = (gameState.energy / gameState.maxEnergy) * 100;
            document.getElementById('energyFill').style.width = energyPercent + '%';

            const btn = document.getElementById('clickBtn');
            if (gameState.energy < 1) {
                btn.classList.add('no-energy');
            } else {
                btn.classList.remove('no-energy');
            }

            // Изменение кнопки в зависимости от апгрейдов
            updateButtonAppearance();
        }

        function updateButtonAppearance() {
            const btn = document.getElementById('clickBtn');
            let emoji = '💎';
            
            if (gameState.upgrades.double_click > 0) emoji = '💰';
            if (gameState.upgrades.auto_clicker > 0) emoji = '⚡';
            if (gameState.upgrades.more_energy > 0) emoji = '💪';
            
            btn.textContent = emoji;
        }

        function createFloatingText(text) {
            const floatingText = document.createElement('div');
            floatingText.className = 'floating-text';
            floatingText.textContent = text;
            
            const btn = document.getElementById('clickBtn');
            const rect = btn.getBoundingClientRect();
            
            floatingText.style.left = (rect.left + rect.width / 2) + 'px';
            floatingText.style.top = (rect.top + rect.height / 2) + 'px';
            
            document.body.appendChild(floatingText);
            
            setTimeout(() => floatingText.remove(), 1000);
        }

        // ======================== SHOP ========================
        function renderShop() {
            const shopList = document.getElementById('shopList');
            shopList.innerHTML = '';

            for (const [key, upgrade] of Object.entries(UPGRADES)) {
                const hasEnough = gameState.coins >= upgrade.price;
                const level = gameState.upgrades[key] || 0;

                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <div class="shop-info">
                        <h3>${upgrade.icon} ${upgrade.name} (Уровень ${level})</h3>
                        <p>${upgrade.desc}</p>
                    </div>
                    <button 
                        class="shop-price" 
                        onclick="buyUpgrade('${key}')"
                        ${!hasEnough ? 'disabled' : ''}
                    >
                        💰 ${upgrade.price}
                    </button>
                `;
                shopList.appendChild(item);
            }
        }

        // ======================== LEADERBOARD ========================
        async function renderLeaderboard() {
            const data = await apiCall('/api/leaderboard');
            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '';

            if (data && data.leaders) {
                data.leaders.forEach(leader => {
                    let rankClass = '';
                    let medal = `#${leader.rank}`;

                    if (leader.rank === 1) {
                        rankClass = 'first';
                        medal = '🥇';
                    } else if (leader.rank === 2) {
                        rankClass = 'second';
                        medal = '🥈';
                    } else if (leader.rank === 3) {
                        rankClass = 'third';
                        medal = '🥉';
                    }

                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    item.innerHTML = `
                        <div class="leaderboard-rank ${rankClass}">${medal}</div>
                        <div class="leaderboard-info">
                            <div class="leaderboard-name">${leader.username}</div>
                            <div class="leaderboard-stats">Уровень ${leader.level}</div>
                        </div>
                        <div class="leaderboard-clicks">${leader.clicks.toLocaleString()}</div>
                    `;
                    leaderboardList.appendChild(item);
                });
            }
        }

        // ======================== ACHIEVEMENTS ========================
        function renderAchievements() {
            const achievementsList = document.getElementById('achievementsList');
            achievementsList.innerHTML = '';

            for (const [key, achievement] of Object.entries(ACHIEVEMENTS_DATA)) {
                const isUnlocked = gameState.achievements.includes(key);

                const item = document.createElement('div');
                item.className = 'achievement-item';
                item.style.opacity = isUnlocked ? '1' : '0.6';
                item.innerHTML = `
                    <div class="achievement-icon">${achievement.icon}</div>
                    <div class="achievement-text">
                        <div class="achievement-name">${achievement.name}</div>
                        <div class="achievement-desc">${achievement.desc}</div>
                    </div>
                    ${isUnlocked ? '<div class="achievement-unlocked">✅ Разблокировано</div>' : ''}
                `;
                achievementsList.appendChild(item);
            }
        }

        // ======================== MODAL MANAGEMENT ========================
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
            
            if (modalId === 'shopModal') {
                renderShop();
            } else if (modalId === 'leaderboardModal') {
                renderLeaderboard();
            } else if (modalId === 'achievementsModal') {
                renderAchievements();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // ======================== EVENT LISTENERS ========================
        function setupEventListeners() {
            document.getElementById('clickBtn').addEventListener('click', processClick);

            document.querySelectorAll('[data-screen]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('[data-screen]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    const screen = e.target.dataset.screen;
                    
                    if (screen === 'shop') {
                        openModal('shopModal');
                    } else if (screen === 'leaderboard') {
                        openModal('leaderboardModal');
                    } else if (screen === 'achievements') {
                        openModal('achievementsModal');
                    }
                });
            });

            // Закрытие модального окна по клику на фон
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                    }
                });
            });
        }

        // ======================== START ========================
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
