{% extends "weather/base.html" %}

{% block title %}Вход - Погода сейчас{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>🔐 Вход в систему</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Имя пользователя:</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Пароль:</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn">Войти</button>
    </form>

    <p style="margin-top: 20px;">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь здесь</a>
    </p>
</div>

<style>
.auth-card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 400px;
    margin: 0 auto;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 5px;
    font-size: 16px;
}
</style>
{% endblock %}
