<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Погодный дашборд{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-6">
        {% if user.is_authenticated %}
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Погодный дашборд</h1>
            <div class="flex items-center space-x-4">
                <span class="text-gray-700">Привет, {{ user.username }}!</span>
                <a href="{% url 'weather_rules' %}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                    Мои правила
                </a>
                <a href="{% url 'logout' %}" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                    Выйти
                </a>
            </div>
        </header>
        {% endif %}
        
        {% if messages %}
            <div class="fixed top-4 right-4 z-50 space-y-2">
                {% for message in messages %}
                    <div class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded-lg shadow-lg flex items-center animate-fade-in">
                        <i class="fas fa-check-circle mr-3 text-blue-600"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
    
            <style>
            @keyframes fade-in {
                from { opacity: 0; transform: translateX(100%); }
                to { opacity: 1; transform: translateX(0); }
            }
            .animate-fade-in {
                animation: fade-in 0.3s ease-out;
            }
            </style>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
