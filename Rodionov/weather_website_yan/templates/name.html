<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherApp | Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='name.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">🌤️</div>
            <h1>Добро пожаловать!</h1>
            <p>Войдите, чтобы узнать погоду</p>

            <form method="post">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Как вас зовут?" required>
                </div>
                <button type="submit" class="login-btn">🚀 Начать путешествие</button>
            </form>

            <div class="features">
                <span>🌍 Точный прогноз</span>
                <span>⚡ Мгновенно</span>
                <span>📱 Удобно</span>
            </div>
        </div>
    </div>
</body>
</html>
