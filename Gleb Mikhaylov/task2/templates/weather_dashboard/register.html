{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Регистрация - Дашборд погоды{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <h3><i class="fas fa-user-plus"></i> Регистрация</h3>
            </div>
            <div class="card-body">
                {% crispy form %}
                <div class="text-center mt-3">
                    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
