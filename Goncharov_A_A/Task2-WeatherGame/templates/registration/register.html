{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<main class="auth">
    <section class="auth__card">
        <h1 class="auth__title">Регистрация</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="auth__fields">
                {% for field in form %}
                <label class="auth__field">
                    <span>{{ field.label }}</span>
                    {{ field }}
                    {% if field.errors %}
                    <span class="auth__error">{{ field.errors|striptags }}</span>
                    {% endif %}
                </label>
                {% endfor %}
            </div>
            <button type="submit" class="btn">Создать аккаунт</button>
        </form>
        <p class="auth__hint">Уже в игре? <a href="{% url 'game:login' %}">Войти</a></p>
    </section>
</main>
{% endblock %}
