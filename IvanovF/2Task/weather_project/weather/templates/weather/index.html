<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            transition: background 0.5s ease-in-out;
        }
        .dashboard {
            max-width: 500px;
            margin: 50px auto;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .weather-icon {
            width: 100px;
        }

        /* Фоны */
        .sunny {
            background: linear-gradient(to right, #f9d423, #ff4e50);
            color: #fff;
        }
        .rainy {
            background: linear-gradient(to right, #00c6fb, #005bea);
            color: #fff;
        }
        .snowy {
            background: linear-gradient(to right, #83a4d4, #b6fbff);
            color: #003366;
        }
        .cloudy {
            background: linear-gradient(to right, #757f9a, #d7dde8);
            color: #fff;
        }
        .default {
            background: #f0f4f8;
            color: #000;
        }
    </style>
</head>
<body class="{% if weather %}{{ weather.bg_class }}{% else %}default{% endif %}">
    <div class="container dashboard">
        <h1 class="text-center mb-4">🌦 Погода</h1>

        <!-- Форма поиска -->
        <form method="POST" class="d-flex mb-4">
            {% csrf_token %}
            <input type="text" name="city" class="form-control me-2" placeholder="Введите город">
            <button type="submit" class="btn btn-dark">Узнать</button>
        </form>

        <!-- Карточка с погодой -->
        {% if weather %}
        <div class="card text-center p-4">
            <h2 class="mb-3">{{ weather.city }}</h2>
            <img src="{{ weather.icon }}" alt="Иконка погоды" class="weather-icon mx-auto mb-3">
            <h3>{{ weather.temperature }}°C</h3>
            <p class="mb-1"><strong>Влажность:</strong> {{ weather.humidity }}%</p>
            <p class="text-muted">{{ weather.description }}</p>
        </div>
        {% endif %}

        <!-- Ошибки -->
        {% if error %}
            <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
