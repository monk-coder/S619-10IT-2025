{% extends "weather/base.html" %}

{% block title %}Редактировать заметку - Погода сейчас{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>✏️ Редактировать заметку</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Заголовок:</label>
            <input type="text" name="title" value="{{ note.title }}"
                   class="search-input" required>
        </div>

        <div class="form-group">
            <label>Содержание:</label>
            <textarea name="content" class="note-textarea"
                     required>{{ note.content }}</textarea>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">💾 Сохранить</button>
            <a href="{% url 'profile' %}" class="btn" style="background: #6c757d;">❌ Отмена</a>
        </div>
    </form>
</div>

<style>
.auth-card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    max-width: 600px;
    margin: 0 auto;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.note-textarea {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    min-height: 200px;
    resize: vertical;
    font-family: Arial, sans-serif;
}
</style>
{% endblock %}
