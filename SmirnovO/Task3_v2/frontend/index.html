<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Заголовок и уровень -->
        <div class="header">
            <div class="level-badge">
                <span>Уровень</span>
                <span id="level">1</span>
            </div>
            <div class="user-info">
                <span id="username">Игрок</span>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">💎</div>
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">Очки</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🪙</div>
                <div class="stat-value" id="coins">0</div>
                <div class="stat-label">Монеты</div>
            </div>
        </div>

        <!-- Прогресс бар энергии -->
        <div class="energy-section">
            <div class="energy-info">
                <span>⚡ Энергия:</span>
                <span id="energy">100</span>/<span id="max-energy">100</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energy-fill"></div>
            </div>
        </div>

        <!-- Основная кнопка клика -->
        <div class="click-section">
            <div class="click-area" id="click-area">
                <div class="crystal" id="crystal">
                    <div class="crystal-inner">💎</div>
                </div>
                <div class="click-effect" id="click-effect">+1</div>
            </div>
        </div>

        <!-- Панель управления -->
        <div class="control-panel">
            <button class="control-btn" id="shop-btn">
                <span class="btn-icon">🛍️</span>
                <span class="btn-text">Магазин</span>
            </button>
            <button class="control-btn" id="leaderboard-btn">
                <span class="btn-icon">📊</span>
                <span class="btn-text">Лидеры</span>
            </button>
            <button class="control-btn" id="achievements-btn">
                <span class="btn-icon">🏆</span>
                <span class="btn-text">Достижения</span>
            </button>
            <button class="control-btn" id="profile-btn">
                <span class="btn-icon">👤</span>
                <span class="btn-text">Профиль</span>
            </button>
        </div>

        <!-- Уведомления -->
        <div class="notifications" id="notifications"></div>
    </div>

    <!-- Модальные окна -->
    <div id="shop-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🛍️ Магазин улучшений</h2>
                <button class="close-btn" id="close-shop">&times;</button>
            </div>
            <div class="modal-body" id="shop-items">
                <!-- Динамически заполняется через JS -->
            </div>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Таблица лидеров</h2>
                <button class="close-btn" id="close-leaderboard">&times;</button>
            </div>
            <div class="modal-body">
                <div class="leaderboard" id="leaderboard">
                    <!-- Динамически заполняется через JS -->
                </div>
            </div>
        </div>
    </div>

<div id="achievements-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏆 Достижения</h2>
                <button class="close-btn" id="close-achievements">&times;</button>
            </div>
            <div class="modal-body">
                <div class="achievements-list" id="achievements-list">
                    <!-- Динамически заполняется через JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/game.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
